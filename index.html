<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اكتشفي عطرك المثالي - كويز العطور</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #fff5f7 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: #666;
        }

        .progress-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 1.5rem;
        }

        .progress-step {
            flex: 1;
            height: 4px;
            background: #f0f0f0;
            border-radius: 2px;
            transition: background 0.3s ease;
        }

        .progress-step.active {
            background: #e91e63;
        }

        .question-container h3 {
            font-size: 18px;
            font-weight: 500;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            width: 100%;
            padding: 16px 20px;
            text-align: right;
            font-size: 15px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            color: #1a1a1a;
        }

        .option-btn:hover {
            border-color: #e91e63;
            background: #fff5f7;
            transform: translateY(-2px);
        }

        .option-btn:active {
            transform: translateY(0);
        }

        .result-container {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card {
            background: linear-gradient(135deg, #fff5f7 0%, #ffffff 100%);
            border: 2px solid #e91e63;
            border-radius: 16px;
            padding: 2rem;
        }

        .result-emoji {
            font-size: 64px;
            margin-bottom: 12px;
        }

        .result-name {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .result-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .result-notes {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .result-notes p:first-child {
            font-size: 13px;
            color: #999;
            margin-bottom: 6px;
        }

        .result-notes p:last-child {
            font-size: 14px;
            font-weight: 500;
            color: #1a1a1a;
        }

        .restart-btn {
            width: 100%;
            padding: 14px 20px;
            background: #e91e63;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .restart-btn:hover {
            background: #c2185b;
            transform: translateY(-2px);
        }

        .restart-btn:active {
            transform: translateY(0);
        }

        .shop-btn {
            display: block;
            width: 100%;
            padding: 16px 20px;
            background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-decoration: none;
            text-align: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
        }

        .shop-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(233, 30, 99, 0.4);
        }

        .shop-btn:active {
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>اكتشفي عطرك المثالي 🌸</h1>
            <p>جاوبي على الأسئلة دي وهنساعدك تختاري الريحة اللي تناسبك</p>
        </div>

        <div id="quiz-container"></div>
        
        <div id="result-container" class="result-container">
            <div class="result-card">
                <div class="result-emoji" id="result-emoji"></div>
                <h2 class="result-name" id="result-name"></h2>
                <p class="result-desc" id="result-desc"></p>
                <div class="result-notes">
                    <p>المكونات</p>
                    <p id="result-notes"></p>
                </div>
                <a href="#" id="product-link" class="shop-btn">اشتري دلوقتي 🛍️</a>
                <button class="restart-btn" onclick="restartQuiz()">جربي كويز تاني</button>
            </div>
        </div>
    </div>

    <script>
        const perfumes = {
            vanilla_crime: {
                name: "Vanilla Crime",
                emoji: "🍦",
                desc: "فانيلا فريش ومنعشة، مش بتخنق خالص",
                notes: "فانيلا · مارشميلو · دراجون فروت · كوكونت",
                link: "https://www.theanneseg.com/products/Vanilla-crime-perfume",
                scores: { sweet: 3, fresh: 2, floral: 0, creamy: 2, fruity: 2 }
            },
            girly: {
                name: "100% Girly",
                emoji: "🌺",
                desc: "ريحة أنيقة ورقيقة للبنت الكلاسيك",
                notes: "كشمش أسود · ورد ناعم · فريزيا · توت",
                link: "https://www.theanneseg.com/products/100girly-perfume",
                scores: { sweet: 1, fresh: 2, floral: 3, creamy: 0, fruity: 2 }
            },
            faya: {
                name: "Faya",
                emoji: "🌷",
                desc: "فلورال مميز وجذاب",
                notes: "أوركيد · توليب · فريزيا · برقوق",
                link: "https://www.theanneseg.com/products/Faya-perfume",
                scores: { sweet: 2, fresh: 1, floral: 3, creamy: 0, fruity: 2 }
            },
            florine: {
                name: "Florine",
                emoji: "🍃",
                desc: "ريحة البشرة النضيفة والمنعشة",
                notes: "ماندرين · أوركيد · توليب · مسك نظيف",
                link: "https://www.theanneseg.com/products/Florine-perfume",
                scores: { sweet: 0, fresh: 3, floral: 2, creamy: 0, fruity: 1 }
            },
            viella: {
                name: "Viella",
                emoji: "🍓",
                desc: "فراولة وفانيلا كريمي بلمسة كوكونت",
                notes: "فراولة · فانيلا كريمي · كوكونت ناعم",
                link: "https://www.theanneseg.com/products/Viella-perfume",
                scores: { sweet: 2, fresh: 1, floral: 0, creamy: 3, fruity: 3 }
            },
            feminizer: {
                name: "Feminizer",
                emoji: "🍮",
                desc: "فانيلا حلوة ودافية مع لمسة كراميل",
                notes: "فانيلا حليبي · فانيلا كريمي · نوتات سكر · دفء كراميل",
                link: "https://www.theanneseg.com/products/Feminizer-perfume",
                scores: { sweet: 3, fresh: 0, floral: 0, creamy: 3, fruity: 0 }
            }
        };

        const questions = [
            {
                q: "إيه نوع الريحة اللي بتحبيها؟",
                options: [
                    { text: "حلوة ودافية 🍯", scores: { sweet: 2, creamy: 1 } },
                    { text: "فريش ومنعشة 🌿", scores: { fresh: 2 } },
                    { text: "فلورال وأنيقة 🌸", scores: { floral: 2 } },
                    { text: "فروتي ومرحة 🍓", scores: { fruity: 2 } }
                ]
            },
            {
                q: "لما بتختاري عطر، بتدوري على إيه؟",
                options: [
                    { text: "حاجة تفضل معايا طول اليوم", scores: { sweet: 1, creamy: 1 } },
                    { text: "حاجة خفيفة ومنعشة", scores: { fresh: 2 } },
                    { text: "حاجة مميزة ولافتة", scores: { floral: 2 } },
                    { text: "حاجة شبابية ومرحة", scores: { fruity: 2 } }
                ]
            },
            {
                q: "إيه اللي بيعجبك في الحلويات؟",
                options: [
                    { text: "الكريم كاراميل والكاستر 🍮", scores: { sweet: 2, creamy: 2 } },
                    { text: "الفواكه الطازة 🍉", scores: { fruity: 2, fresh: 1 } },
                    { text: "الآيس كريم بالفانيلا 🍦", scores: { sweet: 1, creamy: 1 } },
                    { text: "سويتي خفيف 🍬", scores: { sweet: 1, floral: 1, fruity: 1 } }
                ]
            },
            {
                q: "لو هتوصفي نفسك في كلمة؟",
                options: [
                    { text: "رومانسية 💕", scores: { floral: 2, sweet: 1 } },
                    { text: "عملية ونشيطة ⚡", scores: { fresh: 2 } },
                    { text: "دافية وحنينة 🤗", scores: { sweet: 2, creamy: 2 } },
                    { text: "مرحة ومبسوطة 🎉", scores: { fruity: 2 } }
                ]
            },
            {
                q: "إيه لونك المفضل؟",
                options: [
                    { text: "وردي وموف 🌸", scores: { floral: 2 } },
                    { text: "موف فاتح وأبيض 💜", scores: { fresh: 2 } },
                    { text: "بيج وكريمي ☕", scores: { sweet: 1, creamy: 2 } },
                    { text: "أحمر وبرتقالي 🍊", scores: { fruity: 2 } }
                ]
            }
        ];

        let currentQ = 0;
        let userScores = { sweet: 0, fresh: 0, floral: 0, creamy: 0, fruity: 0 };

        function renderQuestion() {
            const container = document.getElementById('quiz-container');
            const question = questions[currentQ];
            
            container.innerHTML = `
                <div class="question-container">
                    <div class="progress-bar">
                        ${questions.map((_, i) => `
                            <div class="progress-step ${i <= currentQ ? 'active' : ''}"></div>
                        `).join('')}
                    </div>
                    
                    <h3>${question.q}</h3>
                    
                    <div class="options">
                        ${question.options.map((opt, i) => `
                            <button class="option-btn" onclick="selectAnswer(${i})">
                                ${opt.text}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function selectAnswer(optionIndex) {
            const option = questions[currentQ].options[optionIndex];
            
            Object.keys(option.scores).forEach(key => {
                userScores[key] += option.scores[key];
            });
            
            currentQ++;
            
            if (currentQ < questions.length) {
                renderQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            let bestMatch = null;
            let bestScore = -1;
            
            Object.entries(perfumes).forEach(([key, perfume]) => {
                let score = 0;
                Object.keys(userScores).forEach(trait => {
                    score += Math.min(userScores[trait], perfume.scores[trait]) * perfume.scores[trait];
                });
                
                if (score > bestScore) {
                    bestScore = score;
                    bestMatch = perfume;
                }
            });
            
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';
            document.getElementById('result-emoji').textContent = bestMatch.emoji;
            document.getElementById('result-name').textContent = bestMatch.name;
            document.getElementById('result-desc').textContent = bestMatch.desc;
            document.getElementById('result-notes').textContent = bestMatch.notes;
            document.getElementById('product-link').href = bestMatch.link;
        }

        function restartQuiz() {
            currentQ = 0;
            userScores = { sweet: 0, fresh: 0, floral: 0, creamy: 0, fruity: 0 };
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('result-container').style.display = 'none';
            renderQuestion();
        }

        // Start the quiz
        renderQuestion();
    </script>
</body>
</html>
